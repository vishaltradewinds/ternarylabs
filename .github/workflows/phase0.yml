name: Phase 0 ternary baseline

on:
  push:
    branches: [main, "odyssey/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install experiment dependency
        run: python -m pip install --upgrade numpy
      - name: Run correctness and reproducibility tests
        run: python -m unittest discover -s tests -v
      - name: Run seeded experiment
        run: python experiments/phase0_ternary_weights.py --output phase0-results.json
      - name: Upload experiment output
        uses: actions/upload-artifact@v4
        with:
          name: phase0-experiment-results
          path: phase0-results.json
